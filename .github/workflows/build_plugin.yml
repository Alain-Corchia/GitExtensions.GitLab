name: Build Git Extensions plugin

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read
      # Trusted Publishing: the OIDC token of the workflow is exchanged for a short-lived nuget.org API key.
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Git Extensions is not installed on the runner. The GitExtensions.Extensibility package can download it,
    # but without authentication, so the GitHub API rate limit of shared runners makes it fail: download the
    # portable version set in Directory.Build.props into ./gitextensions.shared with the workflow token instead.
    - name: Download Git Extensions
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = (Select-Xml -Path Directory.Build.props -XPath '//GitExtensionsReferenceVersion').Node.InnerText
        gh release download $version --repo gitextensions/gitextensions --pattern 'GitExtensions-Portable-x64-*.zip' --output gitextensions.zip
        Expand-Archive gitextensions.zip -DestinationPath gitextensions.shared

    - name: Build
      run: dotnet build GitExtensions.GitLab.sln -c Release

    - name: Test
      run: dotnet test GitExtensions.GitLab.sln -c Release --no-build

    - name: Pack
      run: dotnet pack src/GitExtensions.GitLab/GitExtensions.GitLab.csproj -c Release --no-build -o artifacts

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: GitExtensions.GitLab.MergeRequests
        path: artifacts/*.nupkg

    - name: Log in to nuget.org
      if: startsWith(github.ref, 'refs/tags/v')
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: Alain.Corchia

    - name: Push to nuget.org
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      # dotnet nuget push does not expand the wildcard on Windows runners.
      run: dotnet nuget push (Get-Item artifacts/*.nupkg).FullName --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
