name: Build Git Extensions plugin

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Git Extensions is not installed on the runner: the GitExtensions.Extensibility package
    # downloads the portable version set in Directory.Build.props into ./gitextensions.shared.
    - name: Build
      run: dotnet build GitExtensions.GitLab.sln -c Release

    - name: Test
      run: dotnet test GitExtensions.GitLab.sln -c Release --no-build

    - name: Pack
      run: dotnet pack src/GitExtensions.GitLab/GitExtensions.GitLab.csproj -c Release --no-build -o artifacts

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: GitExtensions.GitLab.MergeRequests
        path: artifacts/*.nupkg

    - name: Push to nuget.org
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.NUGET_PUSH_TOKEN }} --source https://api.nuget.org/v3/index.json --skip-duplicate
